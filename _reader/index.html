<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>学习空间</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235b6cf0'/><path d='M9 9h8.5a5.5 5.5 0 0 1 5.5 5.5V23h-8.5A5.5 5.5 0 0 1 9 17.5z' fill='white'/></svg>">
<script>try{var t=localStorage.getItem('reader-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="打开目录" data-action="menu">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <a class="brand" href="#/"><span class="logo"></span><span class="brand-name">学习空间</span></a>
  <div class="spacer"></div>
  <button class="icon-btn toc-btn" type="button" aria-label="本页目录" data-action="toc" hidden>
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
  </button>
  <button class="icon-btn" type="button" aria-label="切换浅色或深色主题" data-action="theme">
    <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<div class="progress" aria-hidden="true"><span></span></div>
<div class="scrim" data-action="close"></div>

<aside class="sidebar" aria-label="笔记目录">
  <label class="search">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" placeholder="搜索标题或正文" aria-label="搜索笔记" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <nav class="tree"><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div></nav>
  <div class="empty-search" hidden>没有匹配的笔记</div>
</aside>

<main class="content" tabindex="-1"></main>

<nav class="toc" aria-label="本页目录" hidden></nav>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
